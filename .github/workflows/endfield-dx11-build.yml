name: endfield-dx11-build

# Trimmed copy of nightly.yml: builds ONLY the Endfield addon (x64) from whichever branch it is
# dispatched on, and uploads it as a workflow artifact instead of publishing a release.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "CMake target to build (game folder name under src/games)"
        required: false
        default: "endfield"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Generate glad headers (ReShade dependency, needed by endfield-enhancer)
        shell: pwsh
        working-directory: external/reshade/deps
        run: |
          pip install -r glad\requirements.txt
          Copy-Item khronos\*.xml glad\
          Set-Location glad
          python -m glad --out-path .\target --quiet --api "gl:compatibility=4.6,wgl=1.0,vulkan=1.4" --extensions "GL_ARB_texture_compression_bptc,GL_EXT_texture,GL_EXT_texture_compression_s3tc,GL_EXT_texture_storage,GL_EXT_memory_object,GL_EXT_memory_object_win32,GL_EXT_semaphore,GL_EXT_semaphore_win32,WGL_ARB_create_context,WGL_ARB_create_context_profile,WGL_ARB_framebuffer_sRGB,WGL_ARB_multisample,WGL_ARB_pbuffer,WGL_ARB_pixel_format,WGL_ARB_render_texture,VK_EXT_conservative_rasterization,VK_EXT_custom_border_color,VK_EXT_debug_utils,VK_EXT_extended_dynamic_state,VK_EXT_extended_dynamic_state2,VK_EXT_extended_dynamic_state3,VK_EXT_full_screen_exclusive,VK_EXT_graphics_pipeline_library,VK_EXT_host_image_copy,VK_EXT_host_query_reset,VK_EXT_index_type_uint8,VK_EXT_load_store_op_none,VK_EXT_mesh_shader,VK_EXT_multi_draw,VK_EXT_private_data,VK_EXT_swapchain_colorspace,VK_EXT_tooling_info,VK_EXT_transform_feedback,VK_KHR_acceleration_structure,VK_KHR_bind_memory2,VK_KHR_buffer_device_address,VK_KHR_copy_commands2,VK_KHR_create_renderpass2,VK_KHR_dedicated_allocation,VK_KHR_depth_stencil_resolve,VK_KHR_descriptor_update_template,VK_KHR_device_group,VK_KHR_display_swapchain,VK_KHR_draw_indirect_count,VK_KHR_dynamic_rendering,VK_KHR_external_memory_capabilities,VK_KHR_external_memory_win32,VK_KHR_external_semaphore_win32,VK_KHR_format_feature_flags2,VK_KHR_get_memory_requirements2,VK_KHR_get_physical_device_properties2,VK_KHR_image_format_list,VK_KHR_incremental_present,VK_KHR_maintenance4,VK_KHR_maintenance5,VK_KHR_maintenance9,VK_KHR_pipeline_library,VK_KHR_push_descriptor,VK_KHR_ray_tracing_maintenance1,VK_KHR_ray_tracing_pipeline,VK_KHR_surface,VK_KHR_swapchain,VK_KHR_swapchain_mutable_format,VK_KHR_synchronization2,VK_KHR_timeline_semaphore,VK_KHR_win32_surface" c --mx
          Get-ChildItem target\include\glad

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset clang-x64

      - name: Build endfield addon (x64)
        run: cmake --build --preset clang-x64-release --target ${{ inputs.target || 'endfield' }} --verbose

      - name: Show build output
        shell: pwsh
        run: |
          git rev-parse HEAD
          Get-ChildItem build\release\renodx-${{ inputs.target || 'endfield' }}.*
          Get-FileHash -Algorithm MD5 build\release\renodx-${{ inputs.target || 'endfield' }}.addon64

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: renodx-${{ inputs.target || 'endfield' }}-${{ github.sha }}
          path: |
            build/release/renodx-${{ inputs.target || 'endfield' }}.addon64
            build/release/renodx-${{ inputs.target || 'endfield' }}.pdb
          if-no-files-found: error
